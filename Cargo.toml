[package]
authors = ["Masanori KOMAGAMINE"]
categories = ["command-line-utilities"]
description = "webcomp (WEB COMPressor) is a command-line tool that compresses files into multiple formats, including Brotli, Compress (LZW), Deflate, Gzip, and Zstandard. It helps generate pre-compressed files for hosting on web servers to reduce data traffic."
edition = "2021"
homepage = "https://github.com/koma-private/webcomp"
include = ["assets/**/*", "src/**/*", "LICENSE", "*.md"]
keywords = ["brotli", "lzw", "deflate", "gzip", "zstd"]
license = "MIT"
name = "webcomp"
readme = "README.md"
repository = "https://github.com/koma-private/webcomp"
version = "1.0.0"

[dependencies]
anyhow = { version = "1.0.95" }
brotli = { version = "7.0.0" }
clap = { version = "4.5.26", default-features = false }
clap-help = { version = "1.3.1" }
flate2 = { version = "1.0.35" }
globset = "0.4.15"
indicatif = { version = "0.17.9" }
lazy-regex = { version = "3.4.1" }
lzw = { version = "0.10.0" }
md5 = "0.7.0"
threadpool = { version = "1.8.1" }
walkdir = "2.5.0"
zstd = { version = "0.13.2", default-features = false }

[profile.release]
lto = true
strip = true

# see https://users.rust-lang.org/t/how-to-share-external-packages-between-projects/94324/4
[profile.dev]
debug = 1 # less precise locations

[profile.dev.package."*"]
debug = false # no debug symbols for deps
opt-level = 2 # this makes their code smaller too
